name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-qt-floor:
    name: Linux · Qt 6.4 (apt, the supported floor)
    # ubuntu-22.04's apt repos only carry Qt 6.2 -- below this project's 6.4
    # floor (CMakeLists.txt: find_package(Qt6 6.4 REQUIRED ...)). 24.04 is
    # the oldest Ubuntu whose apt Qt6 actually clears that floor (6.4.2, the
    # same version this project's own Linux dev box runs).
    runs-on: ubuntu-24.04
    # Exercises the optional Postgres-backed catalogue (see pl::Database /
    # CatalogueDescriptor). tst_database and friends skip their Postgres
    # cases unless PHOTOLIFE_TEST_PG_DSN is set, so this container is what
    # turns them on in CI -- the SQLite-only path already runs regardless.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: photolife_test
          POSTGRES_PASSWORD: photolife_test
          POSTGRES_DB: photolife_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Install Qt 6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-base-dev-tools qt6-base-private-dev libqt6sql6-sqlite libqt6sql6-psql \
            ninja-build libgl-dev libraw-dev libjpeg-turbo8-dev libexiv2-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          PHOTOLIFE_TEST_PG_DSN: "host=localhost port=5432 dbname=photolife_test user=photolife_test password=photolife_test sslmode=disable"
        run: ctest --test-dir build --output-on-failure

  build-and-test:
    name: ${{ matrix.os }} · Qt ${{ matrix.qt }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt: "6.7.2"
          - os: windows-latest
            qt: "6.7.2"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Install LibRaw and exiv2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libraw-dev libjpeg-turbo8-dev libexiv2-dev

      # Qt is installed as the msvc2019_64 build below, and vcpkg's default
      # triplet builds exiv2 with MSVC too -- without this, CMake falls back
      # to whatever compiler happens to be first on PATH (MinGW GCC on this
      # runner), which cannot link against either of those MSVC-ABI libraries.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Ninja (unlike the "Visual Studio" generator) has no special-cased
      # MSVC discovery -- it searches like Unix Makefiles would, and this
      # runner's pre-installed MinGW g++ can otherwise still win by being a
      # name CMake's generic compiler search tries regardless of PATH order.
      - name: Force MSVC as the compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "CC=cl" >> $env:GITHUB_ENV
          echo "CXX=cl" >> $env:GITHUB_ENV

      # exiv2 is a required dependency and libraw an optional one (see
      # src/CMakeLists.txt), neither with an official Windows package --
      # vcpkg builds both, and pkgconf (a pkg-config-compatible tool) so
      # CMake's FindPkgConfig can locate them the same way it does on
      # Linux/macOS.
      - name: Install exiv2 and libraw (Windows, via vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install exiv2:x64-windows libraw:x64-windows pkgconf:x64-windows
          $installed = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          echo "PKG_CONFIG_PATH=$installed\lib\pkgconfig" >> $env:GITHUB_ENV
          echo "EXIV2_CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows -DPKG_CONFIG_EXECUTABLE=$installed\tools\pkgconf\pkgconf.exe" >> $env:GITHUB_ENV

      - name: Install Qt ${{ matrix.qt }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          modules: qtimageformats
          cache: true

      - uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ env.EXIV2_CMAKE_ARGS }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        id: test

      # Job logs can only be read signed in to GitHub, but annotations are
      # public. On Windows a failing test's output doesn't reach ctest's log
      # at all (a test that aborts loses its buffered stdout), so re-run just
      # the failing tests -- QtTest's report to a file, stderr (where a crash
      # or qFatal says why) to another -- and raise what they say, with the
      # exit code, as an annotation on the run. PowerShell, so the Qt and
      # vcpkg DLLs are found on Windows as they are under ctest.
      - name: Report failing tests
        if: failure() && steps.test.outcome == 'failure'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $log = "build/Testing/Temporary/LastTestsFailed.log"
          if (-not (Test-Path $log)) { exit 0 }
          foreach ($line in Get-Content $log) {
            $t = ($line -split ':', 2)[1]
            $exe = Get-ChildItem -Path build/tests -Filter "$t*" -File |
                   Where-Object { $_.BaseName -eq $t } | Select-Object -First 1
            if (-not $exe) { Write-Output "::error title=$t::the test program wasn't found"; continue }
            $report = "build/$t.txt"; $errors = "build/$t.err"
            & $exe.FullName -o "$report,txt" 2> $errors | Out-Null
            $rc = $LASTEXITCODE
            Write-Output "===== $t (exit $rc) ====="
            $text = if (Test-Path $report) { Get-Content $report } else { @() }
            $stderr = if (Test-Path $errors) { Get-Content $errors } else { @() }
            $text; $stderr
            # The failures with what they compared, else where it stopped.
            $fails = $text | Select-String -Pattern '^(FAIL!|XPASS|QFATAL)' -Context 0,3 |
                     ForEach-Object { $_.Line; $_.Context.PostContext }
            $parts = @("exit $rc")
            if ($fails) { $parts += $fails } else { $parts += ($text | Select-Object -Last 8) }
            if ($stderr) { $parts += "stderr:"; $parts += ($stderr | Select-Object -Last 15) }
            $msg = ($parts -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            Write-Output "::error title=$t::$msg"
          }
