name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Install Qt 6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-base-dev-tools libqt6sql6-sqlite qt6-image-formats-plugins \
            libraw-dev libjpeg-turbo8-dev libexiv2-dev ninja-build libgl-dev libfuse2 file curl

      - name: Build AppImage
        run: packaging/linux/build-appimage.sh "$PWD/build-appimage"

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: build-appimage/PhotoLife-*-x86_64.AppImage
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          modules: qtimageformats
          cache: true

      - uses: lukka/get-cmake@latest

      # exiv2 is a required dependency (see src/CMakeLists.txt) with no
      # official Windows package -- vcpkg builds it, and pkgconf (a
      # pkg-config-compatible tool) so CMake's FindPkgConfig can locate it
      # the same way it does on Linux/macOS.
      - name: Install exiv2 (via vcpkg)
        shell: pwsh
        run: |
          vcpkg install exiv2:x64-windows pkgconf:x64-windows
          $installed = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          echo "PKG_CONFIG_PATH=$installed\lib\pkgconfig" >> $env:GITHUB_ENV
          echo "VCPKG_INSTALLED=$installed" >> $env:GITHUB_ENV
          echo "EXIV2_CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows -DPKG_CONFIG_EXECUTABLE=$installed\tools\pkgconf\pkgconf.exe" >> $env:GITHUB_ENV

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPHOTOLIFE_BUILD_TESTS=OFF ${{ env.EXIV2_CMAKE_ARGS }}
          cmake --build build

      - name: Stage with windeployqt
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build/src/PhotoLife.exe $dist/
          & windeployqt --release --no-translations --sql --no-system-d3d-compiler `
            --no-opengl-sw "$dist/PhotoLife.exe"
          # windeployqt only bundles Qt's own DLLs -- exiv2 and its transitive
          # deps (expat, zlib, ...) come from vcpkg and need copying in too.
          Copy-Item "$env:VCPKG_INSTALLED\bin\*.dll" $dist/ -Force

      - name: Derive version
        id: ver
        shell: bash
        run: |
          v="$(git describe --tags --always --match 'v*' | sed 's/^v//')"
          echo "version=${v:-0.1.0}" >> "$GITHUB_OUTPUT"

      - name: Build installer
        shell: pwsh
        run: |
          & "$env:ProgramFiles(x86)\NSIS\makensis.exe" `
            "/DAPP_VERSION=${{ steps.ver.outputs.version }}" `
            "/DSTAGE_DIR=..\..\dist" `
            packaging/windows/photolife.nsi
          Move-Item packaging/windows/PhotoLife-*-Setup.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: PhotoLife-*-Setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [appimage, windows-installer]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/appimage/PhotoLife-*-x86_64.AppImage
            artifacts/windows-installer/PhotoLife-*-Setup.exe
          generate_release_notes: true
