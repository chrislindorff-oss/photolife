name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: Linux AppImage
    # Deliberately the oldest supported base (older glibc = the resulting
    # AppImage runs on more distros) -- but its apt repos only carry Qt 6.2,
    # below this project's 6.4 floor, so Qt itself comes from the official
    # installer below instead of apt.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libraw-dev libjpeg-turbo8-dev libexiv2-dev ninja-build libgl-dev libfuse2 file curl

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          modules: qtimageformats
          cache: true

      - name: Build AppImage
        run: packaging/linux/build-appimage.sh "$PWD/build-appimage"

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: build-appimage/PhotoLife-*-x86_64.AppImage
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # Qt is installed as the msvc2019_64 build below, and vcpkg's default
      # triplet builds exiv2 with MSVC too -- without this, CMake falls back
      # to whatever compiler happens to be first on PATH (MinGW GCC on this
      # runner), which cannot link against either of those MSVC-ABI libraries.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # Ninja (unlike the "Visual Studio" generator) has no special-cased
      # MSVC discovery -- it searches like Unix Makefiles would, and this
      # runner's pre-installed MinGW g++ can otherwise still win by being a
      # name CMake's generic compiler search tries regardless of PATH order.
      - name: Force MSVC as the compiler
        shell: pwsh
        run: |
          echo "CC=cl" >> $env:GITHUB_ENV
          echo "CXX=cl" >> $env:GITHUB_ENV

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          modules: qtimageformats
          cache: true

      - uses: lukka/get-cmake@latest

      # exiv2 is a required dependency (see src/CMakeLists.txt) with no
      # official Windows package -- vcpkg builds it, and pkgconf (a
      # pkg-config-compatible tool) so CMake's FindPkgConfig can locate it
      # the same way it does on Linux/macOS. libpq is here purely for its
      # DLL: windeployqt's --sql bundles Qt's QPSQL plugin automatically,
      # but the plugin's own runtime dependency (libpq.dll, and its OpenSSL
      # DLLs) isn't a Qt binary and windeployqt never looks for it --
      # without this, the installed app's QPSQL driver silently fails to
      # load and the Shared (Postgres) catalogue option in Settings can't
      # connect.
      - name: Install exiv2 and libpq (via vcpkg)
        shell: pwsh
        run: |
          vcpkg install exiv2:x64-windows pkgconf:x64-windows libpq:x64-windows
          $installed = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          echo "PKG_CONFIG_PATH=$installed\lib\pkgconfig" >> $env:GITHUB_ENV
          echo "VCPKG_INSTALLED=$installed" >> $env:GITHUB_ENV
          echo "EXIV2_CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows -DPKG_CONFIG_EXECUTABLE=$installed\tools\pkgconf\pkgconf.exe" >> $env:GITHUB_ENV

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPHOTOLIFE_BUILD_TESTS=OFF ${{ env.EXIV2_CMAKE_ARGS }}
          cmake --build build

      - name: Stage with windeployqt
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          # qt_standard_project_setup() (called from the top-level
          # CMakeLists.txt) consolidates every executable's output to the
          # top of the build directory on Windows specifically, so it lands
          # next to any DLLs copied alongside it -- unlike the per-subdirectory
          # default (e.g. build/src/...) that applies on Linux/macOS.
          Copy-Item build/PhotoLife.exe $dist/
          # --compiler-runtime pulls in the MSVC redistributable DLLs
          # (MSVCP140.dll, VCRUNTIME140.dll, VCRUNTIME140_1.dll, ...) that the
          # MSVC-built exe needs at runtime -- without it, windeployqt only
          # bundles Qt's own DLLs and installs fail on machines without the
          # VC++ redistributable already installed.
          & windeployqt --release --no-translations --sql --no-system-d3d-compiler `
            --no-opengl-sw --compiler-runtime "$dist/PhotoLife.exe"
          # windeployqt only bundles Qt's own DLLs -- exiv2, libpq and their
          # transitive deps (expat, zlib, OpenSSL, ...) come from vcpkg and
          # need copying in too.
          Copy-Item "$env:VCPKG_INSTALLED\bin\*.dll" $dist/ -Force

      - name: Derive version
        id: ver
        shell: bash
        run: |
          v="$(git describe --tags --always --match 'v*' | sed 's/^v//')"
          echo "version=${v:-0.1.0}" >> "$GITHUB_OUTPUT"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" `
            "/DAPP_VERSION=${{ steps.ver.outputs.version }}" `
            "/DSTAGE_DIR=..\..\dist" `
            packaging/windows/photolife.nsi
          Move-Item packaging/windows/PhotoLife-*-Setup.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: PhotoLife-*-Setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [appimage, windows-installer]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/appimage/PhotoLife-*-x86_64.AppImage
            artifacts/windows-installer/PhotoLife-*-Setup.exe
          generate_release_notes: true
